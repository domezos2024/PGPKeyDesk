name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.1 (must match <Version> in PGPKeyDesk.vbproj)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PGPKeyDesk.slnx

      - name: Build
        run: dotnet build PGPKeyDesk.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/PGPKeyDesk.Tests/PGPKeyDesk.Tests.vbproj -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Code signing via SignPath Foundation is optional: it is active only when the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist (see docs/CODE-SIGNING.md).
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PGPKeyDesk' }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify requested version matches project version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $requested = '${{ inputs.version }}'
          } else {
            $requested = '${{ github.ref_name }}'
          }
          $requested = $requested.Trim() -replace '^v', ''
          [xml]$proj = Get-Content PGPKeyDesk.vbproj
          $projectVersion = ($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $projectVersion) { Write-Error 'No <Version> found in PGPKeyDesk.vbproj'; exit 1 }
          if ($requested -ne $projectVersion) {
            Write-Error "Version mismatch: requested '$requested' but PGPKeyDesk.vbproj has '$projectVersion'."
            exit 1
          }
          "version=$projectVersion" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained win-x64)
        run: dotnet publish PGPKeyDesk.vbproj -c Release -r win-x64 --self-contained true -o publish

      - name: Check whether code signing is configured
        id: sign
        shell: pwsh
        run: |
          $on = (-not [string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) -and (-not [string]::IsNullOrEmpty($env:SIGNPATH_ORGANIZATION_ID))
          "enabled=$($on.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $on) { Write-Warning 'Code signing is NOT configured: release assets will be unsigned (SmartScreen warning).' }

      - name: Collect unsigned application binaries
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing/app | Out-Null
          Copy-Item publish/PGPKeyDesk.exe, publish/PGPKeyDesk.dll signing/app/

      - name: Upload unsigned application binaries
        if: steps.sign.outputs.enabled == 'true'
        id: up-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: signing/app/*

      - name: Sign application binaries (SignPath)
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.up-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/app

      - name: Replace binaries with signed ones and verify signature
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($f in 'PGPKeyDesk.exe', 'PGPKeyDesk.dll') {
            Copy-Item "signed/app/$f" "publish/$f" -Force
            $sig = Get-AuthenticodeSignature "publish/$f"
            if ($sig.Status -ne 'Valid') { Write-Error "$f signature is $($sig.Status)"; exit 1 }
            Write-Host "$f signed by: $($sig.SignerCertificate.Subject)"
          }

      - name: Create ZIP and SHA-256
        id: pkg
        shell: pwsh
        run: |
          $zip = "PGPKeyDesk-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $zip`n", (New-Object System.Text.UTF8Encoding($false)))
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        id: inst
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Error 'choco install innosetup failed'; exit 1 }
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6;$env:ProgramFiles\Inno Setup 6"
          ./installer/build-installer.ps1 -SkipPublish -PublishDir publish
          $setup = "PGPKeyDesk-${{ steps.ver.outputs.version }}-win-x64-setup.exe"
          foreach ($f in @("installer/Output/$setup", "installer/Output/$setup.sha256")) {
            if (-not (Test-Path $f)) { Write-Error "Missing expected installer artifact: $f"; exit 1 }
          }
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer
        if: steps.sign.outputs.enabled == 'true'
        id: up-inst
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: installer/Output/${{ steps.inst.outputs.setup }}

      - name: Sign installer (SignPath)
        if: steps.sign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.up-inst.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer

      - name: Replace installer with signed one, verify signature, refresh SHA-256
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $setup = '${{ steps.inst.outputs.setup }}'
          Copy-Item "signed/installer/$setup" "installer/Output/$setup" -Force
          $sig = Get-AuthenticodeSignature "installer/Output/$setup"
          if ($sig.Status -ne 'Valid') { Write-Error "Installer signature is $($sig.Status)"; exit 1 }
          Write-Host "Installer signed by: $($sig.SignerCertificate.Subject)"
          $hash = (Get-FileHash "installer/Output/$setup" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/installer/Output/$setup.sha256", "$hash  $setup`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Installer smoke test (silent install / uninstall)
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer/Output/${{ steps.inst.outputs.setup }}").Path
          $dir = Join-Path $env:RUNNER_TEMP 'pgpkd-smoke'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=""$dir""" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Install failed: $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\PGPKeyDesk.exe")) { Write-Error 'PGPKeyDesk.exe missing after install'; exit 1 }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Error "Uninstall failed: $($u.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\PGPKeyDesk.exe") { Write-Error 'PGPKeyDesk.exe still present after uninstall'; exit 1 }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $tag = "v$version"
          $zip = '${{ steps.pkg.outputs.zip }}'
          $hash = '${{ steps.pkg.outputs.sha256 }}'
          $setup = '${{ steps.inst.outputs.setup }}'
          $setupHash = (Get-FileHash "installer/Output/$setup" -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesFile = Join-Path $PWD 'release-notes.md'
          $notes = @"
          ## PGPKeyDesk $version (Windows x64, self-contained)

          **SHA-256** of ``$zip``:

          ``````
          $hash
          ``````

          Verify: ``Get-FileHash .\$zip -Algorithm SHA256``

          **Installer** ``$setup`` SHA-256: ``$setupHash``
          "@
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release create $tag $zip "$zip.sha256" "installer/Output/$setup" "installer/Output/$setup.sha256" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "PGPKeyDesk $version" `
            --notes-file $notesFile `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
