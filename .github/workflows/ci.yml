name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PGPKeyDesk.slnx

      - name: Build
        run: dotnet build PGPKeyDesk.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/PGPKeyDesk.Tests/PGPKeyDesk.Tests.vbproj -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  vulnerability-scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PGPKeyDesk.slnx

      - name: Fail on vulnerable NuGet packages
        shell: pwsh
        run: |
          $output = (dotnet list PGPKeyDesk.slnx package --vulnerable --include-transitive 2>&1 | Out-String)
          Write-Host $output
          if ($output -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable NuGet packages found.'
            exit 1
          }
